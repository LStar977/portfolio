<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Count Me In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&family=Shantell+Sans:wght@500;700;800&display=swap">
<style>
  :root{
    --ground:#15102A; --panel:#211A3F; --line:#3A2F66; --text:#FFF4FA; --muted:#B9AEDC;
    --pink:#FF6FA8; --yellow:#FFCF3F; --mint:#4FD1A6; --sky:#63B9FF; --lilac:#A98BFF; --ink:#2A1F4A;
    --ui:'Shantell Sans','Comic Sans MS','Chalkboard SE',system-ui,sans-serif;
    --display:'Chewy','Arial Rounded MT Bold',system-ui,sans-serif;
    color-scheme:dark;
  }
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--text);font-family:var(--ui);-webkit-font-smoothing:antialiased}
  .shell{box-sizing:border-box;min-height:100%;padding-inline:16px;padding-block:14px 18px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .frame{width:min(100%, calc((100vh - 150px) * 16 / 9), 1600px);display:flex;flex-direction:column;gap:10px}
  .stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:18px;overflow:hidden;background:#0d0a1e;box-shadow:0 0 0 3px var(--line),0 24px 60px rgba(0,0,0,.45);cursor:pointer}
  .stage canvas{display:block;width:100%!important;height:100%!important;object-fit:contain}
  .stage:fullscreen{border-radius:0;box-shadow:none;aspect-ratio:auto;width:100vw;height:100vh;background:#000}
  .stage:-webkit-full-screen{border-radius:0;width:100vw;height:100vh;background:#000}

  .overlay{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(21,16,42,.35),rgba(21,16,42,.78));cursor:default;transition:opacity .35s ease}
  .overlay.gone{opacity:0;pointer-events:none}
  .ov{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vw,18px);text-align:center;padding:16px}
  .kicker{margin:0;font-size:clamp(12px,1.5vw,17px);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .title{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(40px,8.4vw,118px);line-height:.95;letter-spacing:.01em;text-wrap:balance;
    -webkit-text-stroke:0; text-shadow:0 4px 0 var(--ink),0 0 0 #fff}
  .title span{display:inline-block;paint-order:stroke fill;-webkit-text-stroke:8px #fff;transform:rotate(var(--r,0deg))}
  .title span:nth-child(odd){--r:-3deg}.title span:nth-child(even){--r:3deg}
  .big-play{display:inline-flex;align-items:center;gap:12px;border:0;border-radius:999px;background:var(--pink);color:var(--ink);font:800 clamp(16px,2vw,24px)/1 var(--ui);padding:14px 28px 14px 22px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
  .big-play:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
  .big-play:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
  .big-play:disabled{background:#6f6690;cursor:progress}
  .big-play svg{width:1.1em;height:1.1em}
  .hint{margin:0;font-size:clamp(11px,1.2vw,14px);color:var(--muted)}
  .hint kbd{font:700 .92em var(--ui);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-bottom-width:2px;border-radius:6px;padding:0 .4em}

  .controls{display:flex;align-items:center;gap:12px}
  .ctl{flex:none;width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--yellow);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
  .ctl svg{width:20px;height:20px}
  .ctl.ghost{background:var(--panel);color:var(--text);box-shadow:inset 0 0 0 2px var(--line)}
  .time{flex:none;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:88px}
  .time b{color:var(--text);font-weight:800}
  .track{position:relative;flex:1;height:18px;cursor:pointer;touch-action:none}
  .segs{position:absolute;inset:4px 0;border-radius:6px;overflow:hidden;background:var(--panel)}
  .seg{position:absolute;top:0;bottom:0;opacity:.35;border-right:2px solid var(--ground)}
  .fillbar{position:absolute;left:0;top:4px;bottom:4px;border-radius:6px 0 0 6px;background:linear-gradient(90deg,var(--pink),var(--yellow));width:0;opacity:.95;pointer-events:none}
  .head{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--ink);left:0;pointer-events:none}
  .chip{flex:none;border:0;border-radius:999px;padding:9px 14px;font:800 13px/1 var(--ui);cursor:pointer;background:var(--panel);color:var(--muted);box-shadow:inset 0 0 0 2px var(--line)}
  .chip[aria-pressed="true"]{background:var(--mint);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
  .secs{display:flex;flex-wrap:wrap;gap:6px}
  .sec{border:0;border-radius:999px;padding:6px 11px;font:700 12px/1 var(--ui);cursor:pointer;background:transparent;color:var(--muted);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 45%,transparent)}
  .sec:hover{color:var(--text)}
  .sec.on{background:var(--c);color:var(--ink);box-shadow:none}
  button:focus-visible,.track:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
  @media (max-width:560px){.time{min-width:0;font-size:12px}.chip{padding:8px 10px}.controls{gap:8px}.ctl{width:40px;height:40px}}
</style>

<main class="shell">

  </div>

/* ============================================================

   p5.js drives the loop; every shape is laid down by a small
   bristle-brush + watercolor engine written for real-time use.
   Everything is a pure function of song time, so scrubbing works.
   ============================================================ */

// ---------- timing: edit these to nudge sync ----------

  ['Intro',0,'#FFB3D1'],['Verse 1',9.93,'#FFCF3F'],['Pre-Chorus',25.62,'#A98BFF'],['Chorus',33.45,'#FF6FA8'],
  ['Verse 2',52.70,'#4FD1A6'],['Bridge',71.65,'#63B9FF'],['Final Chorus',88.53,'#FF8F45'],['Outro',111.3,'#FFE08A'],
];
const POSTER_T = 35.6;

// ---------- constants ----------
const W = 1600, H = 900, TAU = Math.PI * 2;
const INK = '#2A1F4A';
const C = {pink:'#FF6FA8',yellow:'#FFCF3F',mint:'#4FD1A6',sky:'#63B9FF',orange:'#FF8F45',lilac:'#A98BFF',red:'#FF5A5F',lime:'#7ED957',rose:'#FFB3D1',cyan:'#5ED6E8',white:'#FFFFFF',cream:'#FFF3C4'};
const RAINBOW = ['#FF5A5F','#FF8F45','#FFCF3F','#7ED957','#63B9FF','#6C7BFF','#A98BFF'];
const CANDY = [C.pink,C.yellow,C.mint,C.sky,C.orange,C.lilac,C.red,C.lime];
const BODY = [C.pink,C.yellow,C.mint,C.sky,C.orange,C.lilac,C.red,C.lime,C.rose,C.cyan,'#FFE08A','#9FE6C8'];
const ACCS = ['bow','sprout','antenna','curl','beanie','flower','ears','none','bow','sprout','beanie'];
const ACC_COLORS = [C.red,C.pink,C.yellow,C.sky,C.mint,C.lilac,'#FFFFFF',C.orange];
const FONT_UI = "'Shantell Sans','Comic Sans MS','Chalkboard SE',system-ui,sans-serif";
const FONT_D = "Chewy,'Arial Rounded MT Bold',system-ui,sans-serif";
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- math ----------
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const smooth=t=>t*t*(3-2*t);
const easeOut=t=>1-Math.pow(1-t,3);
const easeIn=t=>t*t*t;
const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
function rng(seed){let a=(Math.floor(seed*2654435761)>>>0)||1;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const h1=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);};
function gauss(r){let u=0;while(u===0)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*r());}
const pick=(a,r)=>a[Math.floor(r()*a.length)%a.length];

// ---------- color ----------
function hex(c){if(Array.isArray(c))return c;c=c.replace('#','');return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];}
function css(c,a=1){c=hex(c);return a>=1?`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`:`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a.toFixed(3)})`;}
function mix(a,b,t){a=hex(a);b=hex(b);return[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];}
function shade(c,amt){return amt>=0?mix(c,[255,255,255],amt):mix(c,[34,20,64],-amt);}
function jit(c,r,amt){c=hex(c);const k=(r()*2-1)*amt*255;return[clamp(c[0]+k+(r()-.5)*amt*70,0,255),clamp(c[1]+k+(r()-.5)*amt*70,0,255),clamp(c[2]+k+(r()-.5)*amt*70,0,255)];}

// ---------- canvas helpers ----------
function mk(w,h){const c=document.createElement('canvas');c.width=Math.ceil(w);c.height=Math.ceil(h);const g=c.getContext('2d');g.lineCap='round';g.lineJoin='round';c.g=g;return c;}
function oval(g,x,y,rx,ry,rot=0){g.beginPath();g.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot,0,TAU);g.fill();}
function rrPath(x,y,w,h,r){const p=new Path2D();p.moveTo(x+r,y);p.lineTo(x+w-r,y);p.quadraticCurveTo(x+w,y,x+w,y+r);p.lineTo(x+w,y+h-r);p.quadraticCurveTo(x+w,y+h,x+w-r,y+h);p.lineTo(x+r,y+h);p.quadraticCurveTo(x,y+h,x,y+h-r);p.lineTo(x,y+r);p.quadraticCurveTo(x,y,x+r,y);p.closePath();return p;}
function polyPath(P){const p=new Path2D();P.forEach((q,i)=>i?p.lineTo(q[0],q[1]):p.moveTo(q[0],q[1]));p.closePath();return p;}
function ellipsePts(cx,cy,rx,ry,n=48,a0=0,a1=TAU){const o=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;o.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry]);}return o;}
function linePts(x1,y1,x2,y2,n=20,bend=0){const o=[];const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;for(let i=0;i<=n;i++){const t=i/n,b=Math.sin(t*Math.PI)*bend;o.push([x1+dx*t+nx*b,y1+dy*t+ny*b]);}return o;}
function resample(P,sp){
  if(P.length<2)return P.map(p=>[p[0],p[1]]);
  const out=[[P[0][0],P[0][1]]];let px=P[0][0],py=P[0][1],carry=0;
  for(let i=1;i<P.length;i++){const qx=P[i][0],qy=P[i][1];let dx=qx-px,dy=qy-py,d=Math.hypot(dx,dy);
    while(carry+d>=sp){const t=(sp-carry)/d;px+=dx*t;py+=dy*t;out.push([px,py]);dx=qx-px;dy=qy-py;d=Math.hypot(dx,dy);carry=0;}
    carry+=d;px=qx;py=qy;}
  const L=out[out.length-1];if(Math.hypot(L[0]-px,L[1]-py)>sp*.3)out.push([px,py]);return out;}

// ---------- the brush ----------
// A stroke = a translucent ribbon (the paint body) + individually wobbling bristle lines.
function makeStroke(pts,o={}){
  const w=o.w??20,col=o.color??INK,A=o.alpha??.9,nb=o.bristles??Math.max(3,Math.round(w/3)),r=rng((o.seed??1)*7919+13);
  pts=resample(pts,o.spacing??Math.max(2,w*.25));const n=pts.length,parts=[];if(n<2)return parts;
  const nx=new Float32Array(n),ny=new Float32Array(n),tp=new Float32Array(n);
  for(let i=0;i<n;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;nx[i]=-dy/L;ny[i]=dx/L;}
  const tIn=o.tIn??.1,tOut=o.tOut??.18,minW=o.minW??.2;
  for(let i=0;i<n;i++){const u=i/(n-1);let v=1;if(u<tIn)v=Math.sqrt(u/tIn);if(u>1-tOut)v=Math.min(v,Math.sqrt((1-u)/tOut));tp[i]=minW+(1-minW)*v;}
  const ph=r()*100,wobA=(o.wobble??.08)*w;const wob=i=>Math.sin(i*.15+ph)*wobA*.5+Math.sin(i*.043+ph*2)*wobA;
  const body=o.body??.6;
  if(body>0){const p=new Path2D();
    for(let i=0;i<n;i++){const hw=w*.5*tp[i]*.92,x=pts[i][0]+nx[i]*(hw+wob(i)*.3),y=pts[i][1]+ny[i]*(hw+wob(i)*.3);i?p.lineTo(x,y):p.moveTo(x,y);}
    for(let i=n-1;i>=0;i--){const hw=w*.5*tp[i]*.92;p.lineTo(pts[i][0]-nx[i]*(hw-wob(i)*.3),pts[i][1]-ny[i]*(hw-wob(i)*.3));}
    p.closePath();parts.push({p,fill:true,a:A*body,c:css(col)});}
  const dry=o.dry??.15,rag=o.ragged??.06,jj=o.jit??.6;
  for(let b=0;b<nb;b++){
    const off=(r()*2-1)*.5*w,lw=Math.max(.7,(w/nb)*(.7+r()*1.5)),a=A*(.25+r()*.75),c=css(jit(col,r,o.cj??.06));
    const s0=r()*rag,s1=1-r()*rag*2,wf=.6+r()*.8;const p=new Path2D();let pen=false;
    for(let i=0;i<n;i++){const u=i/(n-1);if(u<s0||u>s1){pen=false;continue;}if(dry>0&&r()<dry*u*u*.5){pen=false;continue;}
      const o2=off*tp[i]+wob(i)*wf+(r()-.5)*jj,x=pts[i][0]+nx[i]*o2,y=pts[i][1]+ny[i]*o2;if(!pen){p.moveTo(x,y);pen=true;}else p.lineTo(x,y);}
    parts.push({p,fill:false,lw,a,c});}
  return parts;}
function drawStroke(g,parts,am=1){for(const q of parts){g.globalAlpha=q.a*am;if(q.fill){g.fillStyle=q.c;g.fill(q.p);}else{g.strokeStyle=q.c;g.lineWidth=q.lw;g.stroke(q.p);}}g.globalAlpha=1;}
const paint=(g,pts,o)=>drawStroke(g,makeStroke(pts,o));

// watercolor-ish recursive deformation (after Tyler Hobbs)
function deform(P,r,depth,amp){for(let d=0;d<depth;d++){const Q=[],n=P.length;for(let i=0;i<n;i++){const a=P[i],b=P[(i+1)%n];Q.push(a);const L=Math.hypot(b[0]-a[0],b[1]-a[1]),v=(a[2]+b[2])/2,s=L*amp*v;Q.push([(a[0]+b[0])/2+gauss(r)*s*.5,(a[1]+b[1])/2+gauss(r)*s*.5,v*(.75+r()*.5)]);}P=Q;}return P;}

    paint(lg,linePts(bx+size*.1,pad+size*.42,bx+size*.26,pad+size*.3,6,0),{w:size*.07,color:'#FFFFFF',alpha:.85,bristles:4,seed:i+99,body:.6});

const SONG=window.SONG||{fps:30,duration:120.2,bass:'',hi:'',lvl:'',kicks:[]};
const ALPH='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-_';
const dec=s=>{const a=new Float32Array(s.length);for(let i=0;i<s.length;i++)a[i]=ALPH.indexOf(s[i])/63;return a;};
const BASS=dec(SONG.bass),HI=dec(SONG.hi),LVL=dec(SONG.lvl);

function dance(t,seed,energy=1){const off=h1(seed)*.05,i=kickIdx(t-off);if(i<0||energy<=0)return{hop:0,sq:1,tilt:0};
  const dt=t-off-KT[i],gap=clamp((i+1<KT.length?KT[i+1]:KT[i]+.5)-KT[i],.3,.6),u=clamp(dt/gap),e=energy*(dt<1?1:Math.exp(-(dt-1)*3));

function crowdState(t,k,energy,up){const d=dance(t,k,energy),wv=Math.sin(F.real*8+k*1.3)*.16,idle=.28+clamp(d.hop/14)*.45;

function bubbleVignette(g,t,a,b,cx,cy){if(t<a||t>b+.35)return;const s=easeBack(seg(t,a,a+.35))*(1-easeIn(seg(t,b,b+.3)));if(s<=.01)return;

let TRANS=[];
function buildTransitions(){
  const defs=[[9.93,'burst',[C.pink,C.yellow,C.sky]],[17.78,'wipe',[C.mint,C.sky,C.yellow]],[25.62,'wipe',['#3B2F7A',C.lilac,C.pink]],[33.45,'burst',[C.yellow,C.pink,C.orange]],[52.70,'wipe',[C.orange,C.rose,C.yellow]],
    [56.50,'wipe',[C.sky,C.yellow,C.mint]],[60.32,'wipe',[C.lilac,C.rose,C.orange]],[71.65,'wipe',['#1E2A6B','#3B2F7A',C.lilac]],[86.70,'fade'],[88.53,'burst',RAINBOW],[111.3,'wipe',[C.rose,C.yellow,C.lilac]]];
  TRANS=defs.map(([t,type,cols],k)=>{const tr={t,type,cols,k};
    if(type==='wipe'){const r=rng(k*97+1);tr.bands=[];for(let i=0;i<7;i++){const y=(i+.5)*H/7;tr.bands.push({y,delay:i*.018+(i%2)*.03,s:makeStroke(linePts(-160,y+(r()-.5)*20,W+160,y+(r()-.5)*30,48,(r()-.5)*40),{w:240,color:cols[i%cols.length],alpha:1,bristles:22,seed:k*50+i,body:.97,tIn:.03,tOut:.03,dry:.05})});}}
    if(type==='burst'){const r=rng(k*31+7);tr.blob=deform(withV(ellipsePts(0,0,1,1,28).slice(0,-1)),r,3,.16);tr.drops=Array.from({length:46},(_,i)=>({a:r()*TAU,d:.8+r()*.9,s:4+r()*16,c:css(cols[i%cols.length])}));}
    return tr;});}
function blobPath(P,s,cx,cy,p=new Path2D()){P.forEach((q,i)=>{const x=cx+q[0]*s,y=cy+q[1]*s;i?p.lineTo(x,y):p.moveTo(x,y);});p.closePath();return p;}
function wipeClip(g,x0,x1,y,hb,seed){g.beginPath();const n=10;
  for(let i=0;i<=n;i++){const u=i/n,yy=y-hb+u*2*hb;g.lineTo(x1-Math.pow(Math.abs(u-.5)*2,2)*80+(h1(seed+i)-.5)*30,yy);}
  for(let i=n;i>=0;i--){const u=i/n,yy=y-hb+u*2*hb;g.lineTo(x0-Math.pow(Math.abs(u-.5)*2,2)*80+(h1(seed+i*3)-.5)*30,yy);}
  g.closePath();g.clip();}
function drawTransitions(g,t){

    if(tr.type==='wipe'){tr.bands.forEach((b,i)=>{let x0,x1;if(d<0){const p=easeInOut(clamp((d+.42-b.delay)/.34));if(p<=0)return;x0=-400;x1=lerp(-200,W+260,p);}else{const q=easeInOut(clamp((d-b.delay)/.36));if(q>=1)return;x0=lerp(-260,W+200,q);x1=W+400;}
      g.save();wipeClip(g,x0,x1,b.y,H/7*.95,tr.k*20+i);drawStroke(g,b.s);g.restore();});}
    else if(tr.type==='burst'){const cx=W/2,cy=H/2;
      if(d<0){const p=easeIn(clamp((d+.32)/.32));if(p<=0)continue;tr.cols.slice(0,3).forEach((c,i)=>{const R=p*1250*(1-i*.24);if(R>2){g.fillStyle=css(c);g.fill(blobPath(tr.blob,R,cx,cy));}});
        for(const dr of tr.drops){const R=p*1100*dr.d;g.fillStyle=dr.c;oval(g,cx+Math.cos(dr.a)*R,cy+Math.sin(dr.a)*R,dr.s*p,dr.s*p);}}
      else{const q=easeOut(clamp(d/.5));if(q>=1)continue;const Rh=q*1300;const p=new Path2D();p.rect(-60,-60,W+120,H+120);blobPath(tr.blob,Rh,cx,cy,p);g.fillStyle=css(tr.cols[0]);g.fill(p,'evenodd');

    else if(tr.type==='fade'){const a=d<0?easeIn(clamp((d+.35)/.35)):1-clamp(d/.25);g.fillStyle=`rgba(13,11,34,${a.toFixed(3)})`;g.fillRect(0,0,W,H);}}}

function seekTo(t){if(!READY)return;if(!UI.started){UI.started=true;$('overlay').classList.add('gone');}Player.seek(t);}
function buildUI(){const dur=Player.duration;$('tDur').textContent=fmt(dur);$('track').setAttribute('aria-valuemax',Math.round(dur));
  SECTIONS.forEach((s,i)=>{const end=SECTIONS[i+1]?SECTIONS[i+1][1]:dur,d=document.createElement('div');d.className='seg';d.style.left=(s[1]/dur*100)+'%';d.style.width=((end-s[1])/dur*100)+'%';d.style.background=s[2];$('segs').appendChild(d);
    const b=document.createElement('button');b.type='button';b.className='sec';b.textContent=s[0];b.style.setProperty('--c',s[2]);b.addEventListener('click',()=>{seekTo(s[1]+.02);if(!Player.playing)togglePlay();});$('secs').appendChild(b);});
  const tr=$('track'),at=e=>{const r=tr.getBoundingClientRect();return clamp((e.clientX-r.left)/r.width)*Player.duration;};
  tr.addEventListener('pointerdown',e=>{if(!READY)return;UI.dragging=true;UI.wasPlaying=Player.playing;if(Player.playing)Player.pause();tr.setPointerCapture(e.pointerId);seekTo(at(e));});
  tr.addEventListener('pointermove',e=>{if(UI.dragging)seekTo(at(e));});
  const end=e=>{if(!UI.dragging)return;UI.dragging=false;seekTo(at(e));if(UI.wasPlaying)Player.play();setPlayingUI();};tr.addEventListener('pointerup',end);tr.addEventListener('pointercancel',end);
  tr.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){seekTo(Player.time()+5);e.preventDefault();}if(e.key==='ArrowLeft'){seekTo(Player.time()-5);e.preventDefault();}});
  $('playBtn').addEventListener('click',togglePlay);$('bigPlay').addEventListener('click',e=>{e.stopPropagation();togglePlay();});
  $('stage').addEventListener('click',e=>{if(e.target.closest('.overlay'))return;togglePlay();});
  $('lyrBtn').addEventListener('click',()=>{UI.lyrics=!UI.lyrics;$('lyrBtn').setAttribute('aria-pressed',String(UI.lyrics));});
  $('fsBtn').addEventListener('click',toggleFS);
  window.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button')&&e.key===' ')return;if(e.key===' '){e.preventDefault();togglePlay();}else if(e.key==='ArrowRight'&&e.target===document.body)seekTo(Player.time()+5);else if(e.key==='ArrowLeft'&&e.target===document.body)seekTo(Player.time()-5);else if(e.key==='l'||e.key==='L')$('lyrBtn').click();else if(e.key==='f'||e.key==='F')toggleFS();});}
function toggleFS(){const el=$('stage');try{if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();}catch(e){}}
let lastSec=-1;
function updateUI(t){const dur=Player.duration,u=clamp(t/dur);$('fillbar').style.width=(u*100)+'%';$('head').style.left=(u*100)+'%';$('tCur').textContent=fmt(t);$('track').setAttribute('aria-valuenow',Math.round(t));
  let si=0;SECTIONS.forEach((s,i)=>{if(t>=s[1])si=i;});if(si!==lastSec){lastSec=si;[...$('secs').children].forEach((b,i)=>b.classList.toggle('on',i===si));}}

// ---------- boot & loop ----------
const F={t:0,real:0,boil:0,bass:0,hi:0,lvl:0,p:0};
let READY=false,LOWQ=false,CTX=null,ft=[];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const nextFrame=()=>new Promise(r=>requestAnimationFrame(()=>r()));
function sceneAt(t){let s=SC[0];for(const x of SC)if(t>=x.t0)s=x;return s;}
const SHAKES=[[33.45,9],[50.8,14],[88.53,16],[108.15,14],[116.82,12]];
function shakeAt(t){if(REDUCED)return[0,0];let x=0,y=0;for(const[ts,a]of SHAKES){const d=t-ts;if(d>=0&&d<.5){const e=a*Math.exp(-d*9);x+=Math.sin(d*90)*e;y+=Math.cos(d*77)*e;}}return[x,y];}
async function boot(){
  const audioP=Player.load('count-me-in.mp3');
  try{await Promise.race([Promise.all([document.fonts.load(`80px Chewy`),document.fonts.load(`800 40px 'Shantell Sans'`),document.fonts.load(`700 40px 'Shantell Sans'`)]),sleep(4000)]);}catch(e){}
  PAPER=makePaper();RAYS=makeRays();GLOBE=makeGlobe(320);buildMillion();buildLights();
  TALLY={v:[0,1,2,3,4,5].map(k=>makeStroke(linePts(0,0,(h1(k)-.5)*6,54,6,(h1(k*3)-.5)*4),{w:8,color:INK,bristles:3,seed:k+60,body:.85,tIn:.05,tOut:.25})),d:[0,1,2].map(k=>makeStroke(linePts(-6,40,76,8,8,3),{w:8,color:C.red,bristles:3,seed:k+70,body:.85}))};
  SUNNY=new Pal(7,{color:C.yellow,acc:'bow',accColor:C.red,rx:50,ry:57});PIP=new Pal(8,{color:C.sky,acc:'sprout',rx:47,ry:55});
  HEADLINE=paintedWord('COUNT ME IN',{size:196,colors:[C.red,C.orange,C.yellow,C.mint,C.sky,C.lilac,C.pink,C.yellow,C.sky],seed:9});
  for(const s of SC){await nextFrame();s.build();}
  buildTransitions();
  await audioP;
  READY=true;buildUI();$('bigPlay').disabled=false;$('bigPlayLabel').textContent='Play';setPlayingUI();}
function frame(){
  const g=CTX;const t=UI.started?Player.time():POSTER_T;
  F.t=t;F.real=performance.now()/1000;F.boil=Math.floor(F.real*7);F.bass=envAt(BASS,t);F.hi=envAt(HI,t);F.lvl=envAt(LVL,t);F.p=pulse(t);
  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.lineCap='round';g.lineJoin='round';
  const[sx,sy]=shakeAt(t);if(sx||sy){g.translate(W/2+sx,H/2+sy);g.scale(1.03,1.03);g.translate(-W/2,-H/2);}
  const s=sceneAt(t);SCENE=s;s.draw(g,t,t-s.t0);
  drawTransitions(g,t);
  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;
  if(!LOWQ)g.drawImage(PAPER,0,0);
  drawCaption(g,t);
  if(UI.started)updateUI(t);
  if(Player.playing&&t>=Player.duration-.05){Player.pause();Player.offset=Player.duration;setPlayingUI();$('bigPlayLabel').textContent='Play again';$('overlay').classList.remove('gone');}
}
function drawLoading(g){g.setTransform(1,0,0,1,0,0);g.fillStyle='#1B1436';g.fillRect(0,0,W,H);const k=(performance.now()/1000)%1.6/1.6;
  g.lineCap='round';g.strokeStyle=css(C.pink);g.lineWidth=40;g.beginPath();g.moveTo(560,450);g.lineTo(560+480*easeInOut(k),450);g.stroke();
  g.font=`800 30px ${FONT_UI}`;g.fillStyle='#B9AEDC';g.textAlign='center';g.fillText('mixing the paints\u2026',800,540);g.textAlign='left';}

new p5(p=>{
  p.setup=()=>{p.pixelDensity(1);const c=p.createCanvas(W,H);c.parent('canvasHost');p.frameRate(60);CTX=p.drawingContext;boot().catch(err=>{console.error(err);$('bigPlayLabel').textContent='Could not load \u2014 reload the page';});};
  p.draw=()=>{const t0=performance.now();if(!READY){drawLoading(CTX);return;}frame();
    ft.push(performance.now()-t0);if(ft.length>120){const avg=ft.reduce((a,b)=>a+b,0)/ft.length;ft=[];if(avg>22)LOWQ=true;}};
});
</script>
