<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TITAN 1.1 Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ---------- Page chrome (theme-aware) ---------- */
:root{
  --page:#F2F1F5; --ink:#1B1A22; --ink2:#5B5868; --ink3:#8A8796; --line:#DEDCE5; --panel:#FFFFFF; --chip:#ECEAF2; --accent:#6D28D9; --accentText:#FFFFFF;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#0D0D12; --ink:#EDEDF4; --ink2:#A9A7B8; --ink3:#77758A; --line:#26252F; --panel:#15151D; --chip:#20202B; --accent:#A78BFA; --accentText:#120B24; color-scheme: dark; }
}
:root[data-theme="dark"]{ --page:#0D0D12; --ink:#EDEDF4; --ink2:#A9A7B8; --ink3:#77758A; --line:#26252F; --panel:#15151D; --chip:#20202B; --accent:#A78BFA; --accentText:#120B24; color-scheme: dark; }

*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:Barlow,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;padding-inline:16px;padding-block:20px 40px;margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:start}
.top{max-width:1180px;margin:0 auto 20px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
.top h1{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:800;font-size:34px;letter-spacing:1.5px;margin:0;line-height:1}
.top p{margin:6px 0 0;color:var(--ink2);max-width:62ch}
.switches{display:flex;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{padding:7px 14px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accentText)}
.tour{display:flex;flex-direction:column;gap:22px}
.tour h2{font:700 12px Barlow,sans-serif;letter-spacing:1.8px;text-transform:uppercase;color:var(--ink3);margin:0 0 8px}
.tour ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.tour li button{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:block}
.tour li button:hover{border-color:var(--accent)}
.tour li button[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tour b{display:block;font-weight:600;font-size:14.5px}
.tour span{display:block;color:var(--ink2);font-size:13px;line-height:1.35;margin-top:2px}
.note{font-size:13px;color:var(--ink3);max-width:62ch;margin:0}
.opt{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2)}
.stage{position:sticky;top:16px}
.fit{transform-origin:top left}
.caption{margin:12px 0 0;color:var(--ink2);font-size:13.5px;max-width:414px;min-height:40px}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.stage{position:static;order:-1;display:flex;flex-direction:column;align-items:center}}

/* ---------- Phone ---------- */
.phone{width:414px;height:868px;border-radius:62px;background:#050507;padding:12px;box-shadow:0 30px 60px rgba(0,0,0,.25),inset 0 0 0 2px #2a2a33}
.scr{--hair:rgba(255,255,255,.05);position:relative;width:390px;height:844px;border-radius:50px;overflow:hidden;background:var(--bg);color:var(--tm);font-family:Barlow,sans-serif;font-size:15px;line-height:1.3;isolation:isolate}
.scr *{-webkit-tap-highlight-color:transparent}

.pad{padding:0 20px}
.c{font-family:"Barlow Condensed",Barlow,sans-serif}
.lab{font-weight:600;font-size:12px;letter-spacing:1.8px;text-transform:uppercase;color:var(--td)}

.glowt{text-shadow:var(--glowText)}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.sp{flex:1}
.dim{color:var(--td)}.soft{color:var(--ts)}.faint{color:var(--tf)}.main{color:var(--tm)}.acc{color:var(--pb)}.gl{color:var(--glow)}.ok{color:var(--ok)}

.sec{width:100%;height:52px;border-radius:16px;background:var(--s2);border:1px solid var(--stroke);color:var(--tm);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15.5px}

.bar{height:4px;border-radius:9px;background:var(--s2);overflow:hidden}

.field{background:var(--fieldBg);border:1px solid var(--fieldEdge);border-radius:14px}
.divi{height:1px;background:var(--hair)}

/* tab bar */
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;background:color-mix(in srgb,var(--tab) 97%,transparent);border-top:1px solid color-mix(in srgb,var(--p) 16%,transparent);display:flex;padding:8px 6px 0;z-index:30}

.tabs .mid button{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,var(--p),var(--pd));margin-top:-26px;display:grid;place-items:center;color:#fff;border:1px solid rgba(255,255,255,.18);box-shadow:0 0 13px var(--pShadow),0 10px 11px var(--dropShadow)}

.dim-bg{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:40;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-radius:26px 26px 0 0;z-index:41;max-height:92%;overflow-y:auto;scrollbar-width:none;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet::-webkit-scrollbar{display:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--tf);opacity:.5;margin:7px auto 0}
.dialog{position:absolute;left:10px;right:10px;bottom:30px;z-index:42;animation:up .25s}

.dialog .cancel{margin-top:8px;background:var(--raised);border-radius:16px;font-weight:600;border:1px solid var(--hair)}

.ring{transform:rotate(-90deg)}

function finishWorkout(){
  const w = S.w;
  w.entries.forEach(e => e.sets = e.sets.filter(s => s.done));
  w.entries = w.entries.filter(e => e.sets.length);
  if (w.title === 'My Workout') w.title = autoTitle(w);
  recomputeLive();
  const before = totalXP();
  const gained = xpFor({entries:w.entries});
  S.summary = {before, after:before + gained, gained, dur:(Date.now() - w.start)/1000, prevVol: (HIST.find(h => h.title === w.title) ? wVol(HIST.find(h => h.title === w.title)) : 0)};
  stopRest(); S.minimized = false; S.editing = null;
  go('finish');
  requestAnimationFrame(() => requestAnimationFrame(() => { const b = document.getElementById('xpbar'); const p = progress(S.summary.after); if (b) b.style.width = (p.frac*100) + '%'; const x = document.getElementById('xpn'); if (x) countUp(x, gained); }));
}
function autoTitle(w){
  const g = {Chest:'Chest',Back:'Back',Traps:'Back',Shoulders:'Shoulders',Biceps:'Arms',Triceps:'Arms',Forearms:'Arms',Core:'Core',Quads:'Legs',Hamstrings:'Legs',Glutes:'Legs',Calves:'Legs',Cardio:'Cardio'};
  const c = {}; w.entries.forEach(e => { const m = g[(EX[e.name]||{}).m]; if (m) c[m] = (c[m]||0) + e.sets.length; });
  const lift = Object.entries(c).filter(([k]) => k !== 'Cardio').sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map(x => x[0]);
  if (!lift.length) return Object.keys(c).join(' & ') || 'Workout';
  if (lift.length === 1) return lift[0] === 'Legs' ? 'Leg Day' : lift[0] === 'Core' ? 'Core' : `${lift[0]} Day`;
  if (lift.length === 2) return `${lift[0]} & ${lift[1]}`;
  return lift.includes('Legs') ? 'Full Body' : 'Upper Body';
}
function countUp(el, target){ const t0 = performance.now(); const f = t => { const k = Math.min(1, (t - t0)/900); el.textContent = '+' + Math.round(target*(1 - Math.pow(1 - k, 3))) + ' XP'; if (k < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); }

  if (s.t === 'warmup') c = 'var(--td)'; else if (s.t === 'failure') { c = 'var(--bad)'; f = 'color-mix(in srgb,var(--bad) 12%,transparent)'; } else if (s.t === 'drop') { c = 'var(--pb)'; f = 'color-mix(in srgb,var(--p) 14%,transparent)'; } else if (pr) { c = 'var(--glow)'; f = 'color-mix(in srgb,var(--glow) 18%,transparent)'; }
  return `<span class="badge" style="color:${c};background:${f}">${setLabel(s, e)}</span>`;
}
function setRow(e, s, i){
  const pr = s.done && s.pr, col = pr ? 'var(--glow)' : s.done ? 'var(--tm)' : 'var(--tf)';
  return `<div class="setrow ${pr ? 'pr' : ''}" onclick="A.edit('${e.id}',${i})" oncontextmenu="A.menu('set','${e.id}',${i},event);return false">
    <span style="width:34px">${badge(e, s)}</span>
    <span class="row" style="flex:1;gap:6px;min-width:0"><span class="faint" style="font-size:14px;white-space:nowrap">${prevText(s, e) || '—'}</span>${pr ? '<span class="prb">✦ PR</span>' : ''}</span>
    <span class="c" style="width:70px;text-align:center;font-weight:700;font-size:22px;color:${col}">${s.w > 0 ? W(s.w) : '—'}</span>
    <span class="c" style="width:50px;text-align:center;font-weight:700;font-size:22px;color:${col}">${s.r}</span>
    <button class="chk press" onclick="event.stopPropagation();${s.done ? `A.unlog('${e.id}',${i})` : `A.log('${e.id}',${i})`}" aria-label="${s.done ? 'Logged. Tap to undo.' : 'Log this set'}"><i class="${s.done ? 'on' : ''}">${s.done ? ic('check',14,3.2) : ''}</i></button>
  </div>`;
}
function setPanel(e, s, i){
  const title = s.t === 'warmup' ? 'WARM-UP' : `SET ${setLabel(s, e)}`;
  const last = prevText(s, e), hint = hintText(e, s);
  const typeT = {working:'WORKING', warmup:'WARM-UP', failure:'TO FAILURE', drop:'DROP SET'}[s.t];
  const tint = {working:'transparent', warmup:'var(--td)', failure:'var(--bad)', drop:'var(--pm)'}[s.t];
  const bw = (EX[e.name]||{}).eq === 'Bodyweight';
  return `<div class="panel" onclick="event.stopPropagation()">
    <div class="row" style="gap:8px">
      <span class="c acc" style="font-weight:800;font-size:19px;letter-spacing:1.2px">${title}</span>
      <button onclick="A.menu('type','${e.id}',${i},event)" class="row" style="gap:4px;height:30px;padding:0 10px;border-radius:999px;font-weight:700;font-size:12px;letter-spacing:.8px;${s.t === 'working' ? 'color:var(--td);border:1px solid var(--outline)' : `color:#fff;background:${tint}`}">${typeT}${ic('chevD',9,3)}</button>
      <span class="sp"></span>${last ? `<span class="dim" style="font-weight:600;font-size:12.5px;white-space:nowrap">LAST ${last}</span>` : ''}
      ${s.done ? `<button onclick="A.closeEdit()" aria-label="Close editor" style="width:44px;height:36px;display:grid;place-items:center"><span class="dim" style="width:30px;height:30px;border-radius:50%;background:var(--surface);display:grid;place-items:center">${ic('x',12,2.8)}</span></button>` : ''}
    </div>
    <div class="row" style="gap:10px">
      <div class="stepper"><div class="box"><button onclick="A.stepW('${e.id}',${i},-1)" aria-label="Decrease weight">${ic('minus',17,2.8)}</button><input inputmode="decimal" aria-label="Weight" value="${s.w > 0 ? num(Math.round(toU(s.w)*100)/100) : (bw ? '' : '0')}" placeholder="0" onfocus="this.select()" oninput="A.typeW('${e.id}',${i},this)"><button onclick="A.stepW('${e.id}',${i},1)" aria-label="Increase weight">${ic('plus',17,2.8)}</button></div><span class="l">${bw ? '+ ' : ''}${UL().toUpperCase()}</span></div>
      <div class="stepper"><div class="box"><button onclick="A.stepR('${e.id}',${i},-1)" aria-label="Decrease reps">${ic('minus',17,2.8)}</button><input inputmode="numeric" aria-label="Reps" value="${s.r}" onfocus="this.select()" oninput="A.typeR('${e.id}',${i},this)"><button onclick="A.stepR('${e.id}',${i},1)" aria-label="Increase reps">${ic('plus',17,2.8)}</button></div><span class="l">REPS</span></div>
    </div>
    <span id="hint-${e.id}" class="dim" style="font-weight:500;font-size:13px;${hint ? '' : 'display:none'}">${hint}</span>
    <div class="row" style="gap:10px">
      ${s.done ? `<button class="press main" onclick="A.unlog('${e.id}',${i})" style="width:104px;height:54px;border-radius:15px;background:var(--surface);border:1px solid var(--stroke);font-weight:600;font-size:15px">Undo log</button>` : ''}
      <button class="logbtn press" onclick="A.log('${e.id}',${i})">${ic('check',16,3.2)}${s.done ? 'SAVE CHANGES' : 'LOG SET'}</button>
    </div>
  </div>`;
}
function restDock(){
  const r = S.rest, rem = Math.max(0, (r.end - Date.now())/1000);
  return `<div class="dock" style="padding-bottom:26px"><div style="padding:14px;border-radius:22px;background:var(--raised);border:1px solid color-mix(in srgb,var(--p) 40%,transparent);box-shadow:${B().light ? '0 4px 16px rgba(0,0,0,.1)' : '0 4px 16px rgba(139,92,246,.25)'}" class="col"><div class="row" style="gap:14px">
    <span style="position:relative;width:56px;height:56px" id="restRing">${progressRing(r.total ? rem/r.total : 0, 5, 56)}<span class="acc" style="position:absolute;inset:0;display:grid;place-items:center">${ic('timer',17,2.4)}</span></span>
    <span class="col"><span class="acc" style="font-weight:700;font-size:11.5px;letter-spacing:2px">REST</span><span class="c main" data-rest-clock style="font-weight:700;font-size:40px;font-variant-numeric:tabular-nums;line-height:1">${clock(Math.ceil(rem))}</span></span><span class="sp"></span>
    ${r.next ? `<span class="col" style="align-items:flex-end;gap:2px;min-width:0;max-width:170px;text-align:right"><span class="faint" style="font-weight:700;font-size:11px;letter-spacing:1.6px">UP NEXT</span><span class="main" style="font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%">${esc(r.next.title)}</span><span class="c soft" style="font-weight:700;font-size:19px;white-space:nowrap">${esc(r.next.detail)}</span></span>` : ''}
  </div><div class="row" style="gap:8px;margin-top:12px">
    ${['−15s','+15s'].map((t, k) => `<button class="press main" onclick="A.rest(${k ? 15 : -15})" style="height:40px;padding:0 14px;border-radius:999px;background:var(--s2);border:1px solid var(--stroke);font-weight:600;font-size:14px">${t}</button>`).join('')}<span class="sp"></span>
    <button class="press c" onclick="A.skip()" style="height:40px;padding:0 24px;border-radius:999px;background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;font-weight:700;font-size:16px;letter-spacing:1.5px">SKIP</button>
  </div></div></div>`;
}

function finishScreen(){
  const w = S.w, b = B(), sum = S.summary;
  const prs = w.entries.flatMap(e => e.sets.filter(s => s.pr).map(s => ({name:e.name, s})));
  const vol = w.entries.reduce((a, e) => a + e.sets.reduce((x, s) => x + setVol(e.name, s), 0), 0);
  const sets = w.entries.reduce((a, e) => a + e.sets.length, 0);
  const rb = rankOf(sum.before), ra = rankOf(sum.after), up = ra > rb;
  const before = progress(sum.before), after = progress(sum.after);
  const pct = sum.prevVol > 0 ? Math.round((vol - sum.prevVol)/sum.prevVol*100) : null;
  const mv = muscleVolume([{entries:w.entries}]), top = Math.max(1, ...Object.values(mv));
  const trained = Object.entries(mv).filter(([m, v]) => v > 0 && m !== 'Cardio').sort((a, b) => b[1] - a[1]).slice(0, 5).map(x => x[0]);
  const tile = (v, l) => `<div class="card col" style="flex:1;align-items:center;gap:3px;padding:14px 4px;border-radius:16px"><span class="c main" style="font-weight:700;font-size:26px">${v}</span><span class="faint" style="font-weight:600;font-size:11px;letter-spacing:1.2px;white-space:nowrap">${l}</span></div>`;
  return `<div class="view" style="background:radial-gradient(340px 340px at 50% 2%,color-mix(in srgb,var(--p) 28%,transparent),transparent)"><div class="pad col" style="gap:14px;padding-top:20px;padding-bottom:40px;animation:up .6s cubic-bezier(.2,.9,.3,1)">
    <div class="col" style="align-items:center;gap:6px;margin-bottom:4px">
      <div style="position:relative;width:128px;height:118px;display:grid;place-items:center"><i style="position:absolute;width:128px;height:128px;border-radius:50%;background:color-mix(in srgb,var(--p) 18%,transparent);filter:blur(18px)"></i><div style="position:relative;animation:pop .6s cubic-bezier(.2,1.3,.4,1)">${hexSVG(92, 100, `<path d="${HEX}" fill="var(--surface)" stroke="color-mix(in srgb,var(--p) 50%,transparent)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`)}<div style="position:absolute;inset:0;display:grid;place-items:center">${logoBars(7, 26, 'var(--glow)', 9)}</div></div></div>
      <span class="c main glowt" style="font-weight:800;font-size:34px;letter-spacing:3.5px;white-space:nowrap;${b.light ? '' : 'text-shadow:0 0 12px color-mix(in srgb,var(--p) 45%,transparent)'}">${b.completeTitle}</span>
      ${b.completeSub ? `<span class="acc" style="font-weight:700;font-size:12px;letter-spacing:2px">${b.completeSub.toUpperCase()}</span>` : ''}
      <span class="dim" style="font-size:15px">${esc(w.title)} · ${timeStr(new Date())}</span>
    </div>
    <div class="row" style="gap:10px">${tile(dur(sum.dur), 'TIME')}${tile(volK(vol), UL().toUpperCase() + ' VOLUME')}${tile(sets, 'SETS')}</div>
    ${up ? `<div class="row" style="gap:16px;padding:18px;border-radius:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--p) 22%,var(--surface)),var(--surface));border:1.5px solid color-mix(in srgb,var(--glow) 60%,transparent);box-shadow:0 0 16px color-mix(in srgb,var(--p) 35%,transparent);animation:pop .7s .2s both cubic-bezier(.2,1.3,.4,1)">${rankEmblem(ra, 64)}<div class="col" style="gap:2px"><span class="acc" style="font-weight:700;font-size:12px;letter-spacing:2px">${b.rankUp}</span><span class="c main" style="font-weight:800;font-size:30px;letter-spacing:1.5px">${rankTitle(ra)}</span><span class="dim" style="font-size:14px">Up from ${rankTitle(rb)}</span></div></div>` : ''}
    ${prs.length ? `<div class="card" style="border-radius:18px;border-color:color-mix(in srgb,var(--glow) 40%,transparent);padding-bottom:4px"><div class="row gl" style="gap:6px;padding:14px 16px 6px">${ic('flame',14)}<span style="font-weight:700;font-size:12.5px;letter-spacing:1.8px">${prs.length === 1 ? 'NEW RECORD' : prs.length + ' NEW RECORDS'}</span></div>${prs.map((p, i) => `<div class="row" style="padding:11px 16px;${i ? 'border-top:1px solid var(--hair)' : ''}"><span class="col" style="gap:2px"><span class="main" style="font-weight:600;font-size:16px">${p.name}</span><span class="dim" style="font-size:13px">${p.s.w > 0 ? `New est. 1RM ${whole(e1(p.s.w, p.s.r))} ${UL()}` : 'Most reps ever'}</span></span><span class="sp"></span><span class="c gl glowt" style="font-weight:700;font-size:23px">${p.s.w > 0 ? `${W(p.s.w)} × ${p.s.r}` : `${p.s.r} reps`}</span></div>`).join('')}</div>` : ''}
    ${pct !== null ? `<div class="card row" style="gap:12px;padding:14px"><span class="acc" style="width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--p) 12%,transparent);display:grid;place-items:center;flex:none">${ic('trend',16,2.6)}</span><span class="soft" style="font-weight:500;font-size:15px">${pct > 0 ? `Volume up ${pct}% on your last ${esc(w.title)}.` : pct < 0 ? `Volume ${-pct}% under your last ${esc(w.title)} — recovery days count too.` : `Matched your last ${esc(w.title)} exactly.`}</span></div>` : ''}
    <div class="card col" style="gap:12px;padding:16px"><span class="lab">Muscles worked</span><div class="row" style="gap:18px"><div class="row" style="gap:6px">${heatMap(true, female(), 64, 96, m => (mv[m]||0)/top)}${heatMap(false, female(), 64, 96, m => (mv[m]||0)/top)}</div><div class="col" style="gap:6px">${trained.map((m, i) => `<span class="row" style="gap:8px"><i style="width:7px;height:7px;border-radius:50%;background:var(--p);opacity:${i ? .55 : 1}"></i><span style="font-size:15px;font-weight:${i ? 400 : 600};color:${i ? 'var(--ts)' : 'var(--tm)'}">${m}</span></span>`).join('')}</div></div></div>
    <div class="card row" style="gap:14px;padding:16px;border-color:color-mix(in srgb,var(--p) 35%,transparent)">${rankEmblem(after.i, 46)}<div class="col" style="flex:1"><div class="row"><span class="c main" style="font-weight:700;font-size:19px;letter-spacing:1.5px">${rankTitle(after.i)}</span><span class="sp"></span><span class="c acc" id="xpn" style="font-weight:700;font-size:19px">+0 XP</span></div><div style="height:8px;border-radius:9px;background:var(--s2);margin-top:8px"><i id="xpbar" style="display:block;height:100%;width:${up ? 0 : before.frac*100}%;border-radius:9px;background:linear-gradient(90deg,var(--pd),var(--p),var(--pb));box-shadow:0 0 5px color-mix(in srgb,var(--pb) 50%,transparent);transition:width 1.1s .35s ease-out"></i></div><span class="dim" style="font-size:13px;margin-top:6px">${after.next !== null ? `${after.span - after.cur} XP to ${rankTitle(after.next)}` : 'Highest rank achieved'}</span></div></div>
    <div class="col" style="gap:12px;padding-top:6px"><button class="cta" onclick="A.done()">${ic('check',15,3)}DONE</button><button class="sec press" onclick="A.share()">${ic('share',15)}Share workout card</button></div>
  </div></div>`;
}

function historyScreen(){
  const m = S.month || (S.month = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1));
  const cur = m.getFullYear() === TODAY.getFullYear() && m.getMonth() === TODAY.getMonth();
  const trained = new Set(HIST.map(w => +sod(w.date)));
  const first = new Date(m.getFullYear(), m.getMonth(), 1), days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
  const cells = Array(first.getDay()).fill(null).concat(Array.from({length:days}, (_, i) => new Date(m.getFullYear(), m.getMonth(), i + 1)));
  const cell = d => {
    if (!d) return '<span style="height:42px"></span>';
    const t = +d, tr = trained.has(t), sel = S.selDay === t, today = t === +TODAY, fut = d > TODAY;
    const color = sel ? '#fff' : tr ? 'var(--tm)' : today ? 'var(--pb)' : fut ? 'color-mix(in srgb,var(--tf) 50%,transparent)' : 'var(--tf)';
    const bg = sel ? 'background:linear-gradient(135deg,var(--p),var(--pd));box-shadow:0 0 8px color-mix(in srgb,var(--p) 50%,transparent);' : tr ? 'background:color-mix(in srgb,var(--p) 26%,transparent);' : '';
    const bd = today && !sel ? 'box-shadow:inset 0 0 0 1.5px var(--pb);' : tr && !sel ? 'box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--p) 50%,transparent);' : '';
    return `<button class="c" ${fut ? 'disabled' : ''} onclick="A.day(${t})" style="height:42px;border-radius:12px;${bg}${bd}color:${color};font-weight:${tr || sel || today ? 700 : 500};font-size:16px;position:relative">${d.getDate()}${[2,9,16].includes((TODAY - d)/DAY) ? `<i style="position:absolute;bottom:4px;left:50%;margin-left:-2.5px;width:5px;height:5px;border-radius:50%;background:${sel ? '#fff' : 'var(--ok)'}"></i>` : ''}</button>`;
  };
  const inMonth = HIST.filter(w => w.date.getMonth() === m.getMonth() && w.date.getFullYear() === m.getFullYear());
  const feed = S.selDay ? HIST.filter(w => +sod(w.date) === S.selDay) : inMonth;
  const mvol = inMonth.reduce((a, w) => a + wVol(w), 0), mprs = inMonth.reduce((a, w) => a + wPRs(w).length, 0), mtime = inMonth.reduce((a, w) => a + w.dur, 0);
  return `<div class="view"><div class="pad col" style="gap:14px;padding-bottom:130px">
    ${screenTitle('HISTORY', streakPill(streak(), false))}
    <div class="card col" style="gap:10px;padding:14px;border-radius:20px">
      <div class="row"><button class="soft press" onclick="A.month(-1)" aria-label="Previous month" style="width:44px;height:44px;display:grid;place-items:center">${ic('chevL',15,2.8)}</button><span class="sp"></span><span class="c main" style="font-weight:700;font-size:21px;letter-spacing:1.8px">${MONL[m.getMonth()].toUpperCase()} ${m.getFullYear()}</span><span class="sp"></span><button class="soft press" onclick="A.month(1)" aria-label="Next month" style="width:44px;height:44px;display:grid;place-items:center;opacity:${cur ? .3 : 1}">${ic('chevR',15,2.8)}</button></div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">${['S','M','T','W','T','F','S'].map(x => `<span class="faint" style="text-align:center;font-weight:700;font-size:11.5px">${x}</span>`).join('')}${cells.map(cell).join('')}</div>
      <div class="row" style="gap:16px;padding-top:4px;font-size:12px" ><span class="row dim" style="gap:6px"><i style="width:11px;height:11px;border-radius:3px;background:color-mix(in srgb,var(--p) 30%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--p) 55%,transparent)"></i>Trained</span><span class="row dim" style="gap:6px"><i style="width:11px;height:11px;border-radius:3px;box-shadow:inset 0 0 0 1.5px var(--pb)"></i>Today</span><span class="row dim" style="gap:5px"><i style="width:6px;height:6px;border-radius:50%;background:var(--ok)"></i>Supplements</span></div>
    </div>
    <div class="card row" style="padding:14px 6px;border-radius:18px">${[[inMonth.length,'WORKOUTS'],[volK(mvol),UL().toUpperCase()],[Math.round(mtime/3600*10)/10 + ' h','TIME'],[mprs, B().recordsTile.toUpperCase()]].map(([v, l], i) => `<div class="col" style="flex:1;align-items:center;gap:2px;${i ? 'border-left:1px solid var(--hair)' : ''}"><span class="c ${i === 3 && mprs ? 'gl' : 'main'}" style="font-weight:700;font-size:22px">${v}</span><span class="faint" style="font-weight:600;font-size:10.5px;letter-spacing:1px">${l}</span></div>`).join('')}</div>
    <span class="lab">${S.selDay ? dayLabel(new Date(S.selDay)) : MONL[m.getMonth()]}</span>
    ${feed.length ? feed.map(w => { const p = wPRs(w).length; return `<button class="card press col" onclick="A.detail('${w.id}')" oncontextmenu="A.detail('${w.id}');return false" style="width:100%;text-align:left;padding:14px 16px;gap:8px;border-radius:18px"><div class="row" style="gap:8px"><span class="col" style="gap:2px;flex:1"><span class="acc" style="font-weight:700;font-size:11.5px;letter-spacing:1.4px">${dayLabel(w.date).toUpperCase()}</span><span class="c main" style="font-weight:700;font-size:23px">${esc(w.title)}</span></span>${p ? `<span class="prb">✦ ${p} ${p === 1 ? 'PR' : 'PRs'}</span>` : ''}<span class="faint">${ic('chevR',12)}</span></div><div class="row dim" style="gap:14px;font-size:13.5px"><span>${dur(w.dur)}</span><span>${volK(wVol(w))} ${UL()}</span><span>${wSets(w)} sets</span></div><div class="dim" style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${w.entries.map(e => e.name).join(' · ')}</div></button>`; }).join('')
      : `<div class="card col" style="align-items:center;gap:6px;padding:26px 20px;text-align:center"><span class="c main" style="font-weight:700;font-size:21px">Rest day</span><span class="dim">Nothing logged on this day.</span></div>`}
  </div></div>${tabBar()}`;
}

function detailScreen(){
  const w = HIST.find(x => x.id === S.detail); if (!w) return historyScreen();
  const ed = S.editDetail, p = wPRs(w).length;
  const top = ed ? `<button class="c press" onclick="A.doneDetail()" style="height:36px;padding:0 18px;border-radius:999px;background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;font-family:Barlow;font-weight:700;font-size:16px">Done</button>`
    : `<button class="circ press" onclick="A.menu('detail',null,null,event)" aria-label="Workout options">${ic('dots',16)}</button>`;
  const tile = (v, l, g) => `<div class="card col" style="flex:1;align-items:center;gap:2px;padding:12px 2px;border-radius:14px"><span class="c ${g ? 'glowt' : ''}" style="font-weight:700;font-size:22px;color:${g ? 'var(--glow)' : 'var(--tm)'}">${v}</span><span class="faint" style="font-weight:600;font-size:10.5px;letter-spacing:1px;white-space:nowrap">${l}</span></div>`;
  return `<div class="view"><div class="pad col" style="gap:14px;padding-bottom:130px">
    ${ed ? `<div class="row" style="min-height:44px"><span class="sp"></span>${top}</div>` : backHeader('History', top)}
    <div class="col" style="gap:3px"><span class="acc" style="font-weight:700;font-size:12px;letter-spacing:1.4px">${dayLabel(w.date).toUpperCase()} · ${timeStr(w.date)}</span>${ed ? `<input value="${esc(w.title)}" oninput="HIST.find(x=>x.id==='${w.id}').title=this.value" class="c field" style="font-weight:800;font-size:32px;color:var(--tm);padding:6px 12px;border-radius:12px;outline:none;width:100%">` : `<span class="c main" style="font-weight:800;font-size:36px;letter-spacing:1px;line-height:1.05">${esc(w.title.toUpperCase())}</span>`}</div>
    <div class="row" style="gap:10px">${tile(dur(w.dur), 'TIME')}${tile(volK(wVol(w)), UL().toUpperCase())}${tile(wSets(w), 'SETS')}${tile(p, B().recordsTile.toUpperCase(), p > 0)}</div>
    ${w.entries.map((e, ei) => { const info = EX[e.name] || {eq:'', m:''}; return `<div class="card" style="border-radius:18px">

function progressScreen(){

  const inR = ([a, z]) => HIST.filter(w => w.date >= a && w.date < z);

  const sum = (ws, f) => ws.reduce((a, w) => a + f(w), 0);

  const mt = (v, l, ch, g) => `<div class="col" style="gap:4px;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--s2) ${b.light ? 60 : 50}%,transparent)"><span class="c ${g ? 'glowt' : ''}" style="font-weight:700;font-size:30px;color:${g ? 'var(--glow)' : 'var(--tm)'}">${v}</span><span class="row" style="gap:6px"><span class="dim" style="font-weight:600;font-size:11px;letter-spacing:1.1px">${l.toUpperCase()}</span>${ch ? `<span style="font-weight:700;font-size:11.5px;color:${ch.up ? 'var(--ok)' : 'var(--tf)'}">${ch.t}</span>` : ''}</span></div>`;
  // weekly bars
  const weeks = Array.from({length:12}, (_, i) => { const s = new Date(+weekStart(now) - (11 - i)*7*DAY); return {s, v:toU(HIST.filter(w => w.date >= s && w.date < new Date(+s + 7*DAY)).reduce((a, w) => a + wVol(w), 0))}; });
  const maxV = Math.max(...weeks.map(x => x.v), 1), niceMax = Math.ceil(maxV/10000)*10000 || 1;
  const CW = 310, CH = 150, bw = CW/12;
  const bars = weeks.map((wk, i) => { const h = wk.v/niceMax*(CH - 20); return `<rect x="${i*bw + 3}" y="${CH - 20 - h}" width="${bw - 6}" height="${Math.max(h, 0)}" rx="4" fill="${i === 11 ? 'var(--pb)' : 'color-mix(in srgb,var(--p) 45%,transparent)'}"/>`; }).join('');
  const grid = [0, .5, 1].map(f => { const y = CH - 20 - f*(CH - 20); return `<line x1="0" x2="${CW}" y1="${y}" y2="${y}" stroke="var(--hair)"/><text x="${CW + 4}" y="${y + 4}" fill="var(--tf)" font-size="11" font-family="Barlow">${compact(niceMax*f)}</text>`; }).join('');
  const xl = [0, 3, 6, 9].map(i => `<text x="${i*bw + bw/2}" y="${CH - 2}" fill="var(--tf)" font-size="11" font-family="Barlow" text-anchor="middle">${shortDate(weeks[i].s)}</text>`).join('');
  // heat map
  const vals = S.heat === 'Sets' ? muscleSets(cur) : muscleVolume(cur);
  const top = Math.max(1, ...Object.values(vals));
  const ranked = Object.entries(vals).filter(([m, v]) => v > 0 && m !== 'Cardio').sort((a, b) => b[1] - a[1]).slice(0, 7);
  // lifts
  const by = {};
  [...HIST].forEach(w => w.entries.forEach(e => { const best = Math.max(0, ...e.sets.filter(s => s.w > 0 && s.t !== 'warmup').map(s => e1(s.w, s.r))); if (best > 0) (by[e.name] ||= []).push(best); }));
  const lifts = Object.entries(by).filter(([, v]) => v.length >= 2).sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0])).slice(0, 6).map(([name, v]) => { const recent = v.slice(0, 10).reverse(); return {name, pts:recent, n:v.length, latest:recent[recent.length - 1], ch:recent[recent.length - 1] - recent[0]}; });
  return `<div class="view"><div class="pad col" style="gap:14px;padding-bottom:130px">
    ${screenTitle('PROGRESS')}
    <div>${pillPicker(['Week','Month','Year'], S.period, 'period')}</div>
    <div class="card col" style="gap:12px;padding:16px;border-radius:20px"><div class="row"><span class="lab">This ${S.period.toLowerCase()}</span><span class="sp"></span><span class="faint" style="font-size:12.5px">vs last ${S.period.toLowerCase()}</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${mt(cur.length, 'Workouts', cc(cur.length, prev.length))}${mt(volK(cv), UL() + ' lifted', pc(cv, pv))}${mt(cs, 'Sets', pc(cs, ps))}${mt(cp, b.recordsTile, null, cp > 0)}</div></div>
    <div class="card col" style="gap:12px;padding:16px;border-radius:20px"><div class="row"><span class="lab">Weekly volume</span><span class="sp"></span><span class="faint" style="font-size:12.5px">Last 12 weeks · ${UL()}</span></div><svg viewBox="0 0 ${CW + 34} ${CH}" width="100%" style="display:block">${grid}${bars}${xl}</svg></div>
    <div class="card col" style="gap:14px;padding:16px;border-radius:20px">
      <div class="row"><span class="lab">Muscles trained</span><span class="sp"></span>${pillPicker(['Sets','Volume'], S.heat, 'heat')}</div>
      <div class="row" style="gap:14px"><div class="col" style="gap:8px;align-items:center">${heatMap(!S.back, female(), 128, 190, m => (vals[m]||0)/top)}<button onclick="A.flip()" class="row acc press" style="gap:5px;height:32px;padding:0 12px;border-radius:999px;background:color-mix(in srgb,var(--p) 12%,transparent);border:1px solid color-mix(in srgb,var(--p) 35%,transparent);font-weight:600;font-size:13px">${ic('cycle',11,2.6)}${S.back ? 'Front' : 'Back'}</button></div>
        <div class="col" style="gap:10px;flex:1;min-width:0">${ranked.length ? ranked.map(([m, v]) => `<div class="col" style="gap:4px"><div class="row"><span class="main" style="font-weight:600;font-size:14px">${m}</span><span class="sp"></span><span class="c soft" style="font-weight:700;font-size:16px">${S.heat === 'Sets' ? num(v, 1) + ' sets' : volK(v)}</span></div><div class="bar" style="height:5px"><i style="width:${v/top*100}%"></i></div></div>`).join('') : `<span class="dim">Nothing logged this ${S.period.toLowerCase()} yet.</span>`}</div></div>

  </div></div>${tabBar()}`;
}

function exerciseScreen(){
  const name = S.exercise, info = EX[name] || {eq:'', m:''}, isDur = info.m === 'Cardio';
  const sessions = HIST.map(w => { const sets = w.entries.filter(e => e.name === name).flatMap(e => e.sets.filter(s => s.t !== 'warmup')); return sets.length ? {w, sets} : null; }).filter(Boolean);
  const recent = sessions.slice(0, 24);
  const loaded = recent.filter(s => s.sets.some(x => x.w > 0)).length;
  const load = !isDur && loaded > 0 && loaded*2 >= recent.length;
  const all = sessions.flatMap(s => s.sets);
  const best = Math.max(0, ...all.filter(s => s.w > 0).map(s => e1(s.w, s.r)));
  const reps = all.filter(s => s.w === 0).map(s => s.r); const most = reps.length ? Math.max(...reps) : Math.max(0, ...all.map(s => s.r));
  const bestSet = all.filter(s => s.w > 0).sort((a, b) => a.w === b.w ? b.r - a.r : b.w - a.w)[0];
  const life = all.reduce((a, s) => a + setVol(name, s), 0);
  const pts = [...recent].reverse().map(s => ({d:s.w.date, pr:s.sets.some(x => x.pr), v: load ? toU(Math.max(0, ...s.sets.filter(x => x.w > 0).map(x => e1(x.w, x.r)))) : Math.max(0, ...s.sets.filter(x => x.w === 0).map(x => x.r))})).filter(p => p.v > 0);

    const X = d => (+d - t0)/(t1 - t0 || 1)*(CW - 16) + 8, Y = v => 8 + (1 - (v - y0)/(y1 - y0))*(CH - 30);
    const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.d).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
    const area = `${line} L${X(pts[pts.length - 1].d).toFixed(1)} ${CH - 22} L${X(pts[0].d).toFixed(1)} ${CH - 22} Z`;
    const ticks = [y0 + (y1 - y0)*.15, (y0 + y1)/2, y1 - (y1 - y0)*.15].map(v => `<line x1="0" x2="${CW}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--hair)"/><text x="${CW + 4}" y="${Y(v) + 4}" fill="var(--tf)" font-size="11" font-family="Barlow">${Math.round(v)}</text>`).join('');
    const xl = [0, Math.floor((pts.length - 1)/2), pts.length - 1].map(i => `<text x="${X(pts[i].d)}" y="${CH - 4}" fill="var(--tf)" font-size="11" font-family="Barlow" text-anchor="${i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle'}">${shortDate(pts[i].d)}</text>`).join('');
    chart = `<div class="card col" style="gap:12px;padding:16px;border-radius:20px"><div class="row"><span class="lab">${isDur ? 'Minutes per session' : load ? 'Estimated 1RM' : 'Best reps'}</span><span class="sp"></span><span class="faint" style="font-size:12.5px">Last ${pts.length} sessions</span></div>
      <svg viewBox="0 0 ${CW + 30} ${CH}" width="100%" style="display:block"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--p)" stop-opacity=".32"/><stop offset="1" stop-color="var(--p)" stop-opacity="0"/></linearGradient></defs>${ticks}<path d="${area}" fill="url(#ag)"/><path d="${line}" fill="none" stroke="var(--p)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${pts.map(p => `<circle cx="${X(p.d)}" cy="${Y(p.v)}" r="${p.pr ? 5 : 3}" fill="${p.pr ? 'var(--glow)' : 'var(--p)'}"/>`).join('')}${xl}</svg>
      ${pts.some(p => p.pr) ? `<span class="row dim" style="gap:6px;font-size:12.5px"><i style="width:8px;height:8px;border-radius:50%;background:var(--glow)"></i>Sessions with a record</span>` : ''}</div>`;
  }
  const targets = [1,3,5,8,10,12], rm = {};

    <div class="col" style="gap:4px"><span class="c main" style="font-weight:800;font-size:34px;letter-spacing:1px;line-height:1.05">${name.toUpperCase()}</span><span class="dim" style="font-weight:600;font-size:12.5px;letter-spacing:1.4px">${info.eq.toUpperCase()} · ${info.m.toUpperCase()} · ${sessions.length} SESSIONS</span></div>
    ${sessions.length ? `<div class="row" style="gap:10px"><div class="card col" style="flex:1;gap:2px;padding:12px 14px;border-radius:16px;border-color:color-mix(in srgb,var(--glow) 35%,transparent)"><span class="gl" style="font-weight:600;font-size:11px;letter-spacing:1.4px">${load ? 'EST. 1RM' : 'MOST REPS'}</span><span class="row" style="gap:2px;align-items:baseline"><span class="c gl glowt" style="font-weight:700;font-size:32px">${load ? whole(best) : most}</span>${load ? `<span class="c dim" style="font-weight:700;font-size:16px">${UL()}</span>` : ''}</span></div>${small('BEST SET', bestSet ? `${W(bestSet.w)}×${bestSet.r}` : '—')}${small('LIFETIME', volK(life))}</div>` : ''}

  </div></div>${tabBar()}`;

function profileScreen(){
  const b = B(), xp = totalXP(), p = progress(xp), group = Math.floor(p.i/3);
  const disp = S.name.trim() ? S.name.trim().toUpperCase() : 'ATHLETE';
  const vol = HIST.reduce((a, w) => a + wVol(w), 0), sets = HIST.reduce((a, w) => a + wSets(w), 0), time = HIST.reduce((a, w) => a + w.dur, 0), prs = HIST.reduce((a, w) => a + wPRs(w).length, 0);
  const climb = [0,1,2,3].map(g => {
    let hex;
    if (g < group) { const c = g === 0 ? b.rankLow : b.rankMid; hex = `<div style="position:relative;width:48px;height:53px">${hexSVG(48, 53, `<defs><linearGradient id="cg${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient></defs><path d="${HEX}" fill="url(#cg${g})"/>`)}<span style="position:absolute;inset:0;display:grid;place-items:center;color:${c[2]}">${ic('check',15,3.4)}</span></div>`; }

function plateSheet(){

let current = null;
function buildTour(){
  const t = document.getElementById('tour');
  t.innerHTML = TOUR.map(([h, items], gi) => `<div><h2>${h}</h2><ol>${items.map(([title, desc], ii) => `<li><button data-g="${gi}" data-i="${ii}"><b>${title}</b><span>${desc}</span></button></li>`).join('')}</ol></div>`).join('')
    + `<label class="opt"><input type="checkbox" id="fast" checked onchange="S.fastRest=this.checked"> Short 10-second rests in this preview (the app uses your real rest times)</label><p class="note">Tap anything on the phone as you would in the app. Long-press (right-click) a set row for its menu. Sample history is generated; the logic is ported from the Swift code.</p>`;
  t.querySelectorAll('button[data-g]').forEach(b => b.addEventListener('click', () => {
    const [title, desc, fn] = TOUR[+b.dataset.g][1][+b.dataset.i];
    current = b; t.querySelectorAll('button[data-g]').forEach(x => x.removeAttribute('aria-current')); b.setAttribute('aria-current', 'true');
    S.sheet = null; S.dialog = null; S.menu = null;
    fn();
    document.getElementById('caption').textContent = `${title}: ${desc}`;
    if (window.innerWidth <= 900) document.getElementById('stage').scrollIntoView({behavior:'smooth', block:'start'});
  }));
}

function fit(){
  const f = document.getElementById('fit'), wide = window.innerWidth > 900;
  const avail = document.querySelector('.wrap').clientWidth;
  const k = Math.max(.55, Math.min(1, avail/414, wide ? (window.innerHeight - 40)/868 : 1));

}
