<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Golden Acropolis Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Geist:wght@400..600&family=Geist+Mono:wght@500&display=swap">
<style>
  /* Layout: one render fills the stage; a caption and six thumbnails sit below it */
  :root {
    --night: #08070a; --ink: #f3ece4; --ink-2: #b4a99e; --hair: rgba(243, 236, 228, .16); --accent: #ffb487;
    --f-display: "Anybody", "Arial Black", sans-serif; --f-body: "Geist", system-ui, sans-serif; --f-mono: "Geist Mono", ui-monospace, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: radial-gradient(120% 90% at 50% 0%, #1a1210, var(--night) 70%); color: var(--ink); font: 15px/1.5 var(--f-body); display: flex; flex-direction: column; padding: max(14px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); gap: 14px; }
  .stage { position: relative; flex: 1; min-height: 0; }
  .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 1; transition: opacity .45s ease; filter: drop-shadow(0 30px 60px rgba(0, 0, 0, .55)); }
  .stage img.is-fading { opacity: 0; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border: 0; cursor: pointer; display: grid; place-items: center; color: var(--ink); background: rgba(8, 7, 10, .6); box-shadow: inset 0 0 0 1px var(--hair); font: 600 20px/1 var(--f-body); }
  .nav:hover { color: var(--night); background: var(--accent); }
  .nav--prev { left: 6px; } .nav--next { right: 6px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
  .caption { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
  .num { font: 500 12px/1 var(--f-mono); letter-spacing: .14em; color: var(--accent); white-space: nowrap; }
  .name { font: 620 clamp(20px, 2.4vw, 30px)/1.1 var(--f-display); font-variation-settings: "wdth" 116; text-transform: uppercase; letter-spacing: .01em; }
  .thumbs { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; }
  .thumbs button { display: block; width: 84px; padding: 0; border: 0; cursor: pointer; background: none; opacity: .55; transition: opacity .25s; box-shadow: inset 0 0 0 1px var(--hair); }
  .thumbs button[aria-current="true"] { opacity: 1; box-shadow: 0 0 0 2px var(--accent); }
  .thumbs button:hover { opacity: .9; }
  .thumbs img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 700px) { .thumbs button { width: 52px; } .nav { width: 40px; height: 40px; } }
  /* portrait: size the stage to the render and centre the group, instead of letterboxing it in the full height */
  @media (max-aspect-ratio: 1 / 1) { body { justify-content: center; } .stage { flex: 0 0 auto; aspect-ratio: 16 / 9; } }
  @media (prefers-reduced-motion: reduce) { .stage img { transition: none; } }
</style>
</head>
<body>
<div class="stage">
  <img id="view" src="views/01.webp" alt="" width="1920" height="1080">
  <button class="nav nav--prev" type="button" id="prev" aria-label="Previous view">‹</button>
  <button class="nav nav--next" type="button" id="next" aria-label="Next view">›</button>
</div>
<div class="bar">
  <p class="caption"><span class="num" id="num">1 of 6</span><span class="name" id="name">Hero view</span></p>
  <ol class="thumbs" id="thumbs" aria-label="Views"></ol>
</div>
<script>
  const VIEWS = [
    ['Hero view', 'A marble terrace with a sun medallion, a blue-domed round temple and the sea at sunset'],
    ['Temple and Athena', 'The temple and a gilded statue of Athena with her shield'],
    ['Sunset sea and headland', 'A balustrade with braziers above the sea, a round temple on the cliff and a temple on the far headland'],
    ['Cascade from above', 'Looking down on the terraces, the round temple, the pool and rows of cypresses'],
    ['Medallion and brazier', 'The sun medallion in the floor and a bronze brazier against the setting sun'],
    ['Nymphaeum waterfalls', 'Three arched fountains pouring into the nymphaeum pool'],
  ];
  const $ = id => document.getElementById(id);
  let at = 0;
  VIEWS.forEach(([name], i) => {
    const li = document.createElement('li'), b = document.createElement('button');
    b.type = 'button'; b.setAttribute('aria-label', name);
    b.innerHTML = `<img src="views/${String(i + 1).padStart(2, '0')}-thumb.webp" alt="" width="320" height="180">`;
    b.onclick = () => show(i);
    li.append(b); $('thumbs').append(li);
  });
  function show(i) {
    at = (i + VIEWS.length) % VIEWS.length;
    const img = $('view'), src = `views/${String(at + 1).padStart(2, '0')}.webp`;
    img.classList.add('is-fading');
    const next = new Image(); next.src = src;
    next.decode().catch(() => {}).then(() => { img.src = src; img.alt = VIEWS[at][1]; img.classList.remove('is-fading'); });
    $('num').textContent = `${at + 1} of ${VIEWS.length}`;
    $('name').textContent = VIEWS[at][0];
    [...$('thumbs').querySelectorAll('button')].forEach((b, k) => b.setAttribute('aria-current', String(k === at)));
    try { history.replaceState(null, '', '#' + (at + 1)); } catch (e) {}
  }
  $('prev').onclick = () => show(at - 1);
  $('next').onclick = () => show(at + 1);
  addEventListener('keydown', e => { if (e.key === 'ArrowRight') show(at + 1); if (e.key === 'ArrowLeft') show(at - 1); });
  let tx = null;
  $('view').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  $('view').addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 40) show(at + (dx < 0 ? 1 : -1)); tx = null; });
  show(Math.max(0, Math.min(VIEWS.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1)));
</script>
</body>
</html>
